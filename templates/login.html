<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — HMPIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#b8966e; --gold-light:#d4b896; --navy:#0a1628; --navy-mid:#112240; --cream:#f5f0e8; --border:rgba(184,150,110,0.2); --border-hover:rgba(184,150,110,0.5); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Jost',sans-serif; background:var(--navy); color:var(--cream); min-height:100vh; }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 20% 50%,rgba(184,150,110,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(17,34,64,0.9) 0%,transparent 50%); pointer-events:none; z-index:0; }
    body::after { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(184,150,110,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(184,150,110,0.04) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; z-index:0; }
    .page-wrapper { position:relative; z-index:1; padding:40px 20px; max-width:960px; margin:0 auto; }
    .page-header { text-align:center; margin-bottom:40px; padding-bottom:30px; border-bottom:1px solid var(--border); }
    .header-tag { font-size:0.68rem; letter-spacing:4px; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:10px; font-weight:300; }
    .page-header h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(1.6rem,4vw,2.4rem); color:var(--cream); letter-spacing:2px; }
    .page-header h1 em { font-style:italic; color:var(--gold-light); }
    .nav-bar { display:flex; gap:10px; margin-bottom:32px; flex-wrap:wrap; }
    .nav-bar a { padding:8px 18px; background:rgba(184,150,110,0.08); color:var(--gold); border-radius:2px; text-decoration:none; font-size:0.75rem; font-weight:300; border:1px solid var(--border); letter-spacing:1px; transition:all 0.3s ease; }
    .nav-bar a:hover { background:rgba(184,150,110,0.15); border-color:var(--border-hover); }
    .patient-select-box { background:rgba(184,150,110,0.06); border:1px solid var(--border-hover); border-radius:2px; padding:20px 24px; margin-bottom:28px; }
    .patient-select-box label { font-size:0.72rem; letter-spacing:3px; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:10px; font-weight:300; }
    .patient-select-box select { width:100%; padding:12px 14px; background:rgba(10,22,40,0.8); border:1px solid var(--border); border-radius:2px; font-family:'Jost',sans-serif; font-size:0.9rem; color:var(--cream); }
    .edit-banner { background:rgba(184,150,110,0.08); border:1px solid rgba(184,150,110,0.3); border-radius:2px; padding:14px 20px; margin-bottom:24px; font-size:0.85rem; color:var(--gold-light); letter-spacing:0.5px; }
    .section { background:rgba(17,34,64,0.5); border:1px solid var(--border); border-radius:2px; padding:24px 28px; margin-bottom:16px; backdrop-filter:blur(10px); transition:border-color 0.3s; }
    .section:hover { border-color:rgba(184,150,110,0.3); }
    .section h3 { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:400; color:var(--gold-light); letter-spacing:3px; text-transform:uppercase; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border); }
    fieldset { background:rgba(17,34,64,0.5); border:1px solid var(--border); border-radius:2px; padding:24px 28px; margin-bottom:16px; backdrop-filter:blur(10px); }
    fieldset:hover { border-color:rgba(184,150,110,0.3); }
    legend { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:400; color:var(--gold-light); letter-spacing:3px; text-transform:uppercase; padding:0 12px; }
    label { display:block; font-size:0.72rem; font-weight:300; letter-spacing:2px; text-transform:uppercase; color:rgba(245,240,232,0.55); margin-top:16px; margin-bottom:6px; }
    input[type="text"],input[type="number"],input[type="date"],textarea,select { width:100%; padding:11px 14px; background:rgba(10,22,40,0.7); border:1px solid var(--border); border-radius:2px; font-family:'Jost',sans-serif; font-size:0.88rem; color:var(--cream); transition:border-color 0.3s; }
    input:focus,select:focus,textarea:focus { outline:none; border-color:var(--gold); background:rgba(10,22,40,0.9); }
    textarea { resize:vertical; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .column { flex:1; min-width:160px; }
    .checkbox-group { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .checkbox-group label { display:flex; align-items:center; gap:8px; margin-top:0; font-weight:300; background:rgba(184,150,110,0.06); padding:8px 14px; border-radius:2px; border:1px solid var(--border); cursor:pointer; font-size:0.75rem; letter-spacing:1px; text-transform:uppercase; transition:all 0.2s; }
    .checkbox-group label:hover { background:rgba(184,150,110,0.12); border-color:var(--border-hover); color:var(--gold-light); }
    .checkbox-group input[type="checkbox"] { width:auto; margin:0; accent-color:var(--gold); }
    .radio-row { display:flex; align-items:center; gap:20px; margin-bottom:16px; flex-wrap:wrap; }
    .radio-row span { font-size:0.72rem; letter-spacing:2px; text-transform:uppercase; color:rgba(245,240,232,0.55); font-weight:300; }
    .radio-row label { display:flex; align-items:center; gap:6px; margin-top:0; font-weight:300; cursor:pointer; font-size:0.85rem; letter-spacing:1px; text-transform:none; color:var(--cream); }
    .radio-row input[type="radio"] { width:auto; accent-color:var(--gold); }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px 20px; margin-bottom:16px; }
    .grid-3>div { display:flex; flex-direction:column; }
    .grid-3 select { width:100%; margin-bottom:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-top:8px; }
    .grid label { font-size:0.7rem; letter-spacing:1.5px; text-transform:uppercase; color:rgba(245,240,232,0.45); margin-bottom:4px; margin-top:0; }
    .grid input { padding:9px 12px; }
    .submit-bar { text-align:center; padding:32px 0 16px; }
    .btn-submit { padding:14px 60px; background:transparent; color:var(--gold); border:1px solid var(--gold); border-radius:2px; font-family:'Jost',sans-serif; font-size:0.8rem; font-weight:300; letter-spacing:4px; text-transform:uppercase; cursor:pointer; transition:all 0.3s ease; }
    .btn-submit:hover { background:var(--gold); color:var(--navy); }
    .inline-group { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .inline-group span { font-size:0.72rem; letter-spacing:2px; text-transform:uppercase; color:rgba(245,240,232,0.55); font-weight:300; }
    .inline-group select { width:auto; padding:9px 14px; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .page-wrapper { animation:fadeUp 0.6s ease both; }
    .center-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative; z-index:1; }
    .login-card { width:100%; max-width:420px; background:rgba(17,34,64,0.7); border:1px solid var(--border-hover); border-radius:2px; padding:50px 40px; backdrop-filter:blur(10px); animation:fadeUp 0.6s ease both; }
    .emblem { width:60px; height:60px; border:1px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
    .emblem-icon { font-size:1.4rem; }
    .card-tag { font-size:0.65rem; letter-spacing:4px; text-transform:uppercase; color:var(--gold); text-align:center; display:block; margin-bottom:10px; font-weight:300; }
    h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:1.8rem; color:var(--cream); text-align:center; margin-bottom:4px; }
    h1 em { font-style:italic; color:var(--gold-light); }
    .subtitle { font-size:0.7rem; letter-spacing:3px; text-transform:uppercase; color:rgba(245,240,232,0.3); text-align:center; margin-bottom:36px; display:block; }
    .divider { width:40px; height:1px; background:var(--border-hover); margin:0 auto 32px; }
    label { display:block; font-size:0.65rem; letter-spacing:3px; text-transform:uppercase; color:rgba(245,240,232,0.45); margin-bottom:8px; font-weight:300; }
    input { width:100%; padding:12px 16px; background:rgba(10,22,40,0.8); border:1px solid var(--border); border-radius:2px; font-family:'Jost',sans-serif; font-size:0.9rem; color:var(--cream); margin-bottom:20px; transition:border-color 0.3s; }
    input:focus { outline:none; border-color:var(--gold); }
    .btn-submit { width:100%; padding:14px; background:transparent; color:var(--gold); border:1px solid var(--gold); border-radius:2px; font-family:'Jost',sans-serif; font-size:0.75rem; font-weight:300; letter-spacing:4px; text-transform:uppercase; cursor:pointer; transition:all 0.3s; margin-top:8px; }
    .btn-submit:hover { background:var(--gold); color:var(--navy); }
    .error { background:rgba(220,53,69,0.1); border:1px solid rgba(220,53,69,0.3); color:#f28b8b; font-size:0.8rem; padding:12px 16px; border-radius:2px; margin-bottom:20px; text-align:center; }
    .register-link { text-align:center; margin-top:24px; font-size:0.72rem; color:rgba(245,240,232,0.35); letter-spacing:1px; }
    .register-link a { color:var(--gold); text-decoration:none; }
    .register-link a:hover { text-decoration:underline; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="center-wrap">
    <div class="login-card">
      <div class="emblem"><span class="emblem-icon">✦</span></div>
      <span class="card-tag">Service d'Anesthésie</span>
      <h1>Hôpital <em>Militaire</em></h1>
      <span class="subtitle">Tunis · République Tunisienne</span>
      <div class="divider"></div>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <label>Identifiant</label>
        <input type="text" name="username" placeholder="Votre identifiant" autocomplete="username">
        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
        <button type="submit" class="btn-submit">Se Connecter</button>
      </form>
      <div class="register-link">
        Pas encore de compte ? <a href="/register">Créer un compte</a>
      </div>
    </div>
  </div>
</body>
</html>
